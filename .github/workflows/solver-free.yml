name: Solver-free release checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  bootstrap-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate archive boundaries without optimization software
        working-directory: Zonal
        run: python -B -m unittest discover -s tests -p test_bootstrap_stdlib.py -v
